name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build Linux binary
        run: make CFLAGS="-O3 -flto -fomit-frame-pointer -std=c11 -Wall -Wextra"

      - name: Build Windows binary
        run: make windows

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" Ashift Ashift.exe \
            --target "${{ github.sha }}" \
            --title "Ashift ${{ inputs.tag }} - 64-bit Types" \
            --notes "Adds \`u64\` and \`i64\` data types."
